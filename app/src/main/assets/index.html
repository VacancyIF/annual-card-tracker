<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>年卡统计</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;padding:16px;padding-bottom:80px}
  .card{background:#1e293b;border-radius:16px;padding:16px;margin-bottom:16px;border:1px solid #334155;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
  .card h2{font-size:18px;font-weight:600;margin-bottom:12px;color:#f1f5f9;display:flex;align-items:center;gap:8px}
  .badge{font-size:12px;padding:2px 8px;border-radius:999px;font-weight:500}
  .badge.active{background:#05966920;color:#34d399;border:1px solid #05966940}
  .badge.expired{background:#dc262620;color:#f87171;border:1px solid #dc262640}
  .badge.pending{background:#d9770620;color:#fbbf24;border:1px solid #d9770640}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat-item{background:#0f172a;border-radius:12px;padding:12px;border:1px solid #334155}
  .stat-label{font-size:12px;color:#94a3b8;margin-bottom:4px}
  .stat-value{font-size:20px;font-weight:700;color:#38bdf8}
  .stat-value.green{color:#34d399}
  .stat-value.red{color:#f87171}
  .btn{width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.2s}
  .btn-primary{background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:white}
  .btn-primary:active{transform:scale(0.98);opacity:0.9}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed}
  .btn-secondary{background:#334155;color:#e2e8f0}
  .btn-danger{background:#dc262620;color:#f87171;border:1px solid #dc262640}
  .type-select{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
  .type-btn{padding:10px;border-radius:10px;background:#0f172a;border:1px solid #334155;color:#94a3b8;font-size:14px;cursor:pointer;text-align:center}
  .type-btn.active{background:#0ea5e920;color:#38bdf8;border-color:#0ea5e9}
  .form-group{margin-bottom:12px}
  .form-group label{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px}
  .form-group input{width:100%;padding:10px 12px;border-radius:10px;background:#0f172a;border:1px solid #334155;color:#e2e8f0;font-size:15px;outline:none}
  .form-group input:focus{border-color:#0ea5e9}
  .progress-bar{width:100%;height:8px;background:#0f172a;border-radius:999px;overflow:hidden;margin-top:8px;border:1px solid #334155}
  .progress-fill{height:100%;background:linear-gradient(90deg,#0ea5e9,#06b6d4);border-radius:999px;transition:width 0.3s}
  .record-list{max-height:240px;overflow-y:auto}
  .record-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #334155}
  .record-item:last-child{border-bottom:none}
  .record-info{font-size:14px}
  .record-type{font-size:12px;color:#94a3b8;margin-top:2px}
  .del-btn{font-size:12px;color:#f87171;background:none;border:none;cursor:pointer;padding:4px 8px}
  .chart-container{width:100%;height:200px;margin:8px 0}
  .chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .chart-row .chart-container{height:160px}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .header h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,#38bdf8,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .settings-btn{width:40px;height:40px;border-radius:10px;background:#1e293b;border:1px solid #334155;color:#94a3b8;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal.hidden{display:none}
  .modal-content{background:#1e293b;border-radius:16px;padding:20px;width:100%;max-width:360px;border:1px solid #334155}
  .modal h3{font-size:18px;margin-bottom:16px;color:#f1f5f9}
  .modal-actions{display:flex;gap:10px;margin-top:16px}
  .modal-actions button{flex:1}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{flex:1;padding:10px;text-align:center;border-radius:10px;background:#0f172a;border:1px solid #334155;color:#94a3b8;font-size:14px;cursor:pointer}
  .tab.active{background:#0ea5e920;color:#38bdf8;border-color:#0ea5e9}
  .page.hidden{display:none}
</style>
</head>
<body>

<div class="header">
  <h1>年卡统计</h1>
  <button class="settings-btn" onclick="showSettings()">⚙</button>
</div>

<!-- 首页 -->
<div id="page-home" class="page">
  <div class="card">
    <h2>
      <span id="cardName">游泳健身年卡</span>
      <span id="statusBadge" class="badge active">生效中</span>
    </h2>
    <div class="grid">
      <div class="stat-item">
        <div class="stat-label">已过天数</div>
        <div class="stat-value" id="passedDays">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">剩余天数</div>
        <div class="stat-value" id="remainDays">0</div>
      </div>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressBar" style="width:0%"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#94a3b8;margin-top:6px">
      <span id="startDateText">-</span>
      <span id="endDateText">-</span>
    </div>
  </div>

  <div class="card">
    <h2>成本统计</h2>
    <div class="grid">
      <div class="stat-item">
        <div class="stat-label">到访次数</div>
        <div class="stat-value" id="totalVisits">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">累计人次</div>
        <div class="stat-value" id="totalPersonTimes">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">实际单次成本</div>
        <div class="stat-value green" id="actualCostPer">¥0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">累计节省</div>
        <div class="stat-value green" id="totalSaved">¥0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">预计全周期次数</div>
        <div class="stat-value" id="estimatedVisits">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">预计单次成本</div>
        <div class="stat-value" id="estimatedCostPer">¥0</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>快捷打卡</h2>
    <div class="type-select">
      <div class="type-btn active" data-type="gym" onclick="selectType('gym')">健身</div>
      <div class="type-btn" data-type="swim" onclick="selectType('swim')">游泳</div>
      <div class="type-btn" data-type="both" onclick="selectType('both')">都做</div>
    </div>
    <button id="checkinBtn" class="btn btn-primary" onclick="showCheckinModal()">确认打卡</button>
  </div>

  <div class="card">
    <h2>统计图表</h2>
    <div class="chart-container">
      <canvas id="monthChart"></canvas>
    </div>
    <div class="chart-row">
      <div class="chart-container">
        <canvas id="typeChart"></canvas>
      </div>
      <div class="chart-container">
        <canvas id="costChart"></canvas>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>最近记录</h2>
    <div id="recordList" class="record-list"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-secondary" style="flex:1;font-size:13px" onclick="exportData()">导出备份</button>
      <button class="btn btn-danger" style="flex:1;font-size:13px" onclick="clearRecords()">清空记录</button>
    </div>
  </div>
</div>

<!-- 设置页 -->
<div id="page-settings" class="page hidden">
  <div class="card">
    <h2>参数配置</h2>
    <div class="form-group">
      <label>卡片名称</label>
      <input type="text" id="inputName" placeholder="游泳健身年卡">
    </div>
    <div class="form-group">
      <label>开卡日期</label>
      <input type="date" id="inputStartDate">
    </div>
    <div class="form-group">
      <label>有效期（月）</label>
      <input type="number" id="inputDuration" value="12" min="1">
    </div>
    <div class="form-group">
      <label>年卡总价（元）</label>
      <input type="number" id="inputTotalPrice" value="2000" min="0">
    </div>
    <div class="form-group">
      <label>单次原价（元）</label>
      <input type="number" id="inputSinglePrice" value="50" min="0">
    </div>
    <button class="btn btn-primary" onclick="saveSettings()">保存配置</button>
  </div>
  <button class="btn btn-secondary" onclick="showHome()">返回首页</button>
</div>

<!-- 打卡弹窗 -->
<div id="checkinModal" class="modal hidden">
  <div class="modal-content">
    <h3>新增打卡记录</h3>
    <div class="form-group">
      <label>日期</label>
      <input type="date" id="checkinDate">
    </div>
    <div class="form-group">
      <label>项目</label>
      <div class="type-select" style="margin-bottom:0">
        <div class="type-btn active" data-modal-type="gym" onclick="selectModalType('gym')">健身</div>
        <div class="type-btn" data-modal-type="swim" onclick="selectModalType('swim')">游泳</div>
        <div class="type-btn" data-modal-type="both" onclick="selectModalType('both')">都做</div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="hideCheckinModal()">取消</button>
      <button id="confirmCheckinBtn" class="btn btn-primary" onclick="doCheckin()">确认添加</button>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div id="confirmModal" class="modal hidden">
  <div class="modal-content">
    <h3 id="confirmTitle">确认操作</h3>
    <p id="confirmText" style="color:#94a3b8;margin-bottom:8px"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="hideConfirm()">取消</button>
      <button class="btn btn-primary" id="confirmBtn">确认</button>
    </div>
  </div>
</div>

<script>
"use strict";

var config = {
  name: "游泳健身年卡",
  startDate: "2026-01-01",
  durationMonths: 12,
  totalPrice: 2000,
  singlePrice: 50
};

var records = [];
var currentType = "gym";
var modalType = "gym";
var checkinCooldown = false;

// 解析本地日期（修复时区bug）
function parseDate(str) {
  var parts = str.split("-");
  return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
}

// 格式化日期
function formatDate(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

// 计算天数差
function daysDiff(a, b) {
  var ms = b.getTime() - a.getTime();
  return Math.floor(ms / (1000 * 60 * 60 * 24));
}

// 获取今天0点
function getToday() {
  var now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate());
}

// 加载数据
function loadData() {
  try {
    var savedConfig = localStorage.getItem("card_config");
    if (savedConfig) config = JSON.parse(savedConfig);
    var savedRecords = localStorage.getItem("card_records");
    if (savedRecords) records = JSON.parse(savedRecords);
  } catch(e) {}
  
  // 填充设置表单
  document.getElementById("inputName").value = config.name;
  document.getElementById("inputStartDate").value = config.startDate;
  document.getElementById("inputDuration").value = config.durationMonths;
  document.getElementById("inputTotalPrice").value = config.totalPrice;
  document.getElementById("inputSinglePrice").value = config.singlePrice;
}

// 保存配置
function saveSettings() {
  config.name = document.getElementById("inputName").value || "年卡";
  config.startDate = document.getElementById("inputStartDate").value;
  config.durationMonths = parseInt(document.getElementById("inputDuration").value) || 12;
  config.totalPrice = parseFloat(document.getElementById("inputTotalPrice").value) || 0;
  config.singlePrice = parseFloat(document.getElementById("inputSinglePrice").value) || 0;
  
  localStorage.setItem("card_config", JSON.stringify(config));
  compute();
  renderRecords();
  renderCharts();
  showHome();
}

// 计算所有统计
function compute() {
  var today = getToday();
  var start = parseDate(config.startDate);
  
  // 计算结束日期
  var end = new Date(start);
  end.setMonth(end.getMonth() + config.durationMonths);
  
  var totalDays = daysDiff(start, end);
  var passed = daysDiff(start, today);
  var remain = daysDiff(today, end);
  
  // 状态判断
  var status = "active";
  if (passed < 0) status = "pending";
  else if (remain <= 0) status = "expired";
  
  // 更新状态徽章
  var badge = document.getElementById("statusBadge");
  badge.className = "badge " + status;
  if (status === "active") badge.textContent = "生效中";
  else if (status === "expired") badge.textContent = "已过期";
  else badge.textContent = "未生效";
  
  // 更新天数
  document.getElementById("passedDays").textContent = Math.max(0, passed);
  document.getElementById("remainDays").textContent = Math.max(0, remain);
  document.getElementById("startDateText").textContent = config.startDate;
  document.getElementById("endDateText").textContent = formatDate(end);
  
  // 进度条
  var progress = totalDays > 0 ? (Math.max(0, Math.min(1, passed / totalDays)) * 100) : 0;
  document.getElementById("progressBar").style.width = progress + "%";
  
  // 记录统计
  var visits = records.length;
  var personTimes = 0;
  for (var i = 0; i < records.length; i++) {
    personTimes += records[i].type === "both" ? 2 : 1;
  }
  
  document.getElementById("totalVisits").textContent = visits;
  document.getElementById("totalPersonTimes").textContent = personTimes;
  
  // 成本计算
  var actualPer = visits > 0 ? config.totalPrice / visits : 0;
  var saved = personTimes * config.singlePrice - config.totalPrice;
  var estimatedVisits = passed > 0 ? Math.round(visits / passed * totalDays) : 0;
  var estimatedPer = estimatedVisits > 0 ? config.totalPrice / estimatedVisits : 0;
  
  document.getElementById("actualCostPer").textContent = "¥" + actualPer.toFixed(2);
  document.getElementById("totalSaved").textContent = "¥" + Math.max(0, saved).toFixed(2);
  document.getElementById("estimatedVisits").textContent = estimatedVisits;
  document.getElementById("estimatedCostPer").textContent = "¥" + estimatedPer.toFixed(2);
  
  document.getElementById("cardName").textContent = config.name;
}

// 选择打卡类型
function selectType(type) {
  currentType = type;
  var btns = document.querySelectorAll(".type-btn[data-type]");
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle("active", btns[i].dataset.type === type);
  }
}

function selectModalType(type) {
  modalType = type;
  var btns = document.querySelectorAll(".type-btn[data-modal-type]");
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle("active", btns[i].dataset.modalType === type);
  }
}

// 显示打卡弹窗
function showCheckinModal() {
  document.getElementById("checkinDate").value = formatDate(getToday());
  selectModalType(currentType);
  document.getElementById("checkinModal").classList.remove("hidden");
}

function hideCheckinModal() {
  document.getElementById("checkinModal").classList.add("hidden");
}

// 执行打卡
function doCheckin() {
  if (checkinCooldown) return;
  
  var date = document.getElementById("checkinDate").value;
  if (!date) return;
  
  records.unshift({
    date: date,
    type: modalType,
    time: Date.now()
  });
  
  records.sort(function(a, b) {
    return parseDate(b.date).getTime() - parseDate(a.date).getTime();
  });
  
  localStorage.setItem("card_records", JSON.stringify(records));
  
  // 冷却防误触
  checkinCooldown = true;
  var btn = document.getElementById("confirmCheckinBtn");
  btn.disabled = true;
  btn.textContent = "已添加";
  
  setTimeout(function() {
    checkinCooldown = false;
    btn.disabled = false;
    btn.textContent = "确认添加";
    hideCheckinModal();
    compute();
    renderRecords();
    renderCharts();
  }, 1000);
}

// 删除记录
function deleteRecord(index) {
  showConfirm("删除记录", "确定要删除这条记录吗？", function() {
    records.splice(index, 1);
    localStorage.setItem("card_records", JSON.stringify(records));
    compute();
    renderRecords();
    renderCharts();
  });
}

// 渲染记录列表
function renderRecords() {
  var list = document.getElementById("recordList");
  if (records.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:#64748b;padding:20px">暂无记录</div>';
    return;
  }
  
  var html = "";
  var typeText = {gym:"健身", swim:"游泳", both:"健身+游泳"};
  for (var i = 0; i < Math.min(records.length, 20); i++) {
    var r = records[i];
    html += '<div class="record-item">' +
      '<div class="record-info">' + r.date +
        '<div class="record-type">' + typeText[r.type] + '</div>' +
      '</div>' +
      '<button class="del-btn" onclick="deleteRecord(' + i + ')">删除</button>' +
    '</div>';
  }
  list.innerHTML = html;
}

// 确认弹窗
var confirmCallback = null;
function showConfirm(title, text, cb) {
  document.getElementById("confirmTitle").textContent = title;
  document.getElementById("confirmText").textContent = text;
  confirmCallback = cb;
  document.getElementById("confirmModal").classList.remove("hidden");
  
  document.getElementById("confirmBtn").onclick = function() {
    hideConfirm();
    if (confirmCallback) confirmCallback();
  };
}

function hideConfirm() {
  document.getElementById("confirmModal").classList.add("hidden");
  confirmCallback = null;
}

// 清空记录
function clearRecords() {
  showConfirm("清空记录", "确定要清空所有打卡记录吗？此操作不可恢复。", function() {
    records = [];
    localStorage.setItem("card_records", JSON.stringify(records));
    compute();
    renderRecords();
    renderCharts();
  });
}

// 导出备份
function exportData() {
  var data = JSON.stringify({config: config, records: records}, null, 2);
  var blob = new Blob([data], {type: "application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "年卡备份_" + formatDate(getToday()) + ".json";
  a.click();
  URL.revokeObjectURL(url);
}

// 页面切换
function showSettings() {
  document.getElementById("page-home").classList.add("hidden");
  document.getElementById("page-settings").classList.remove("hidden");
}

function showHome() {
  document.getElementById("page-settings").classList.add("hidden");
  document.getElementById("page-home").classList.remove("hidden");
}

// 渲染图表
function renderCharts() {
  renderMonthChart();
  renderTypeChart();
  renderCostChart();
}

// 月度趋势图
function renderMonthChart() {
  var canvas = document.getElementById("monthChart");
  var ctx = canvas.getContext("2d");
  var w = canvas.width = canvas.offsetWidth * 2;
  var h = canvas.height = canvas.offsetHeight * 2;
  ctx.scale(2, 2);
  
  ctx.clearRect(0, 0, w, h);
  
  // 按月份统计
  var monthData = {};
  for (var i = 0; i < records.length; i++) {
    var m = records[i].date.substring(0, 7);
    monthData[m] = (monthData[m] || 0) + 1;
  }
  
  var months = Object.keys(monthData).sort();
  if (months.length === 0) {
    ctx.fillStyle = "#64748b";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("暂无数据", w/4, h/4);
    return;
  }
  
  var maxVal = Math.max.apply(null, Object.values(monthData));
  var barW = (w/2 - 40) / months.length - 8;
  var chartH = h/2 - 40;
  
  ctx.fillStyle = "#94a3b8";
  ctx.font = "11px sans-serif";
  ctx.textAlign = "center";
  
  for (var j = 0; j < months.length; j++) {
    var val = monthData[months[j]];
    var barH = (val / maxVal) * chartH;
    var x = 20 + j * (barW + 8);
    var y = chartH - barH + 20;
    
    var gradient = ctx.createLinearGradient(0, y, 0, y + barH);
    gradient.addColorStop(0, "#0ea5e9");
    gradient.addColorStop(1, "#06b6d4");
    ctx.fillStyle = gradient;
    
    ctx.beginPath();
    ctx.roundRect(x, y, barW, barH, 4);
    ctx.fill();
    
    ctx.fillStyle = "#94a3b8";
    ctx.fillText(months[j].substring(5), x + barW/2, chartH + 35);
    ctx.fillText(val, x + barW/2, y - 4);
  }
}

// 类型占比环图
function renderTypeChart() {
  var canvas = document.getElementById("typeChart");
  var ctx = canvas.getContext("2d");
  var w = canvas.width = canvas.offsetWidth * 2;
  var h = canvas.height = canvas.offsetHeight * 2;
  ctx.scale(2, 2);
  
  ctx.clearRect(0, 0, w, h);
  
  var gym = 0, swim = 0;
  for (var i = 0; i < records.length; i++) {
    if (records[i].type === "gym") gym++;
    else if (records[i].type === "swim") swim++;
    else { gym++; swim++; }
  }
  
  var total = gym + swim;
  if (total === 0) {
    ctx.fillStyle = "#64748b";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("暂无数据", w/4, h/4);
    return;
  }
  
  var cx = w/4, cy = h/4, r = Math.min(w, h)/4 - 20;
  var start = -Math.PI / 2;
  
  // 健身
  var gymAngle = (gym / total) * Math.PI * 2;
  ctx.fillStyle = "#0ea5e9";
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, r, start, start + gymAngle);
  ctx.closePath();
  ctx.fill();
  start += gymAngle;
  
  // 游泳
  ctx.fillStyle = "#06b6d4";
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, r, start, start + (swim / total) * Math.PI * 2);
  ctx.closePath();
  ctx.fill();
  
  // 内环
  ctx.fillStyle = "#1e293b";
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.6, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = "#e2e8f0";
  ctx.font = "bold 14px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(total + "人次", cx, cy + 5);
  
  // 图例
  ctx.font = "11px sans-serif";
  ctx.textAlign = "left";
  ctx.fillStyle = "#0ea5e9";
  ctx.fillRect(w/2 - 10, 30, 8, 8);
  ctx.fillStyle = "#94a3b8";
  ctx.fillText("健身 " + gym, w/2 + 2, 37);
  
  ctx.fillStyle = "#06b6d4";
  ctx.fillRect(w/2 - 10, 50, 8, 8);
  ctx.fillStyle = "#94a3b8";
  ctx.fillText("游泳 " + swim, w/2 + 2, 57);
}

// 成本下降曲线
function renderCostChart() {
  var canvas = document.getElementById("costChart");
  var ctx = canvas.getContext("2d");
  var w = canvas.width = canvas.offsetWidth * 2;
  var h = canvas.height = canvas.offsetHeight * 2;
  ctx.scale(2, 2);
  
  ctx.clearRect(0, 0, w, h);
  
  if (records.length < 2) {
    ctx.fillStyle = "#64748b";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("数据不足", w/4, h/4);
    return;
  }
  
  var chartW = w/2 - 40;
  var chartH = h/2 - 40;
  var maxCost = config.totalPrice;
  var maxVisits = Math.max(records.length, 10);
  
  // 坐标轴
  ctx.strokeStyle = "#334155";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(20, 20);
  ctx.lineTo(20, 20 + chartH);
  ctx.lineTo(20 + chartW, 20 + chartH);
  ctx.stroke();
  
  // 曲线
  ctx.strokeStyle = "#34d399";
  ctx.lineWidth = 2;
  ctx.beginPath();
  
  for (var n = 1; n <= maxVisits; n++) {
    var cost = config.totalPrice / n;
    var x = 20 + (n / maxVisits) * chartW;
    var y = 20 + chartH - (cost / maxCost) * chartH;
    
    if (n === 1) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  
  // 当前点
  var currentX = 20 + (records.length / maxVisits) * chartW;
  var currentY = 20 + chartH - (config.totalPrice / records.length / maxCost) * chartH;
  ctx.fillStyle = "#34d399";
  ctx.beginPath();
  ctx.arc(currentX, currentY, 4, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = "#94a3b8";
  ctx.font = "10px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("单次成本曲线", w/4, h/2 - 5);
}

// 初始化
window.onload = function() {
  loadData();
  compute();
  renderRecords();
  setTimeout(renderCharts, 100);
  
  window.addEventListener("resize", renderCharts);
};
</script>
